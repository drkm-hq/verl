# verl CPU unit-test config, kept OUTSIDE the clone (CI writes the same two lines
# into verl/pytest.ini). Use with:
#   pytest -c <repo>/pytest-cpu.ini --rootdir <repo>/verl ...
[pytest]
python_files = *_on_cpu.py
# .pytest_cache is NOT in verl's .gitignore; keep it out of the clone.
cache_dir = .pytest_cache
